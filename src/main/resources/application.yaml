spring:
  application:
    name: curricula-web
server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
curricula:
  api:
    base-url: ${CURRICULA_API_URL:http://localhost:8081}
  planning-enabled: ${CURRICULA_PLANNING_ENABLED:false}
